# =============================================================================
# /etc/nginx/sites-available/vetty
# Nginx config για vetty.gr
# Το Cloudflare Tunnel στέλνει το traffic εδώ — δεν χρειάζεται SSL στο nginx
# γιατί το Cloudflare κάνει SSL termination.
# =============================================================================

# ── api.vetty.gr → Node.js API (port 5000) ───────────────────────────────────
server {
    listen 80;
    server_name api.vetty.gr;

    # Logs
    access_log /var/log/vetty/api-access.log;
    error_log  /var/log/vetty/api-error.log;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # WebSocket support (Socket.IO)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Buffer
        proxy_buffering    off;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── app.vetty.gr → React frontend (static build) ─────────────────────────────
server {
    listen 80;
    server_name app.vetty.gr;

    root  /var/www/vetty-app;
    index index.html;

    access_log /var/log/vetty/app-access.log;
    error_log  /var/log/vetty/app-error.log;

    # SPA routing — όλα τα paths πάνε στο index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets — cache 1 χρόνο (Vite/CRA παράγει hashed filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

# ── www.vetty.gr → Landing page (static) ─────────────────────────────────────
server {
    listen 80;
    server_name www.vetty.gr vetty.gr;

    root  /var/www/vetty-landing;
    index index.html;

    access_log /var/log/vetty/landing-access.log;
    error_log  /var/log/vetty/landing-error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
