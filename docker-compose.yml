services:
  vet-api:
    build: ./vet-api
    container_name: vet-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./vet-api/uploads:/app/uploads
      - ./vet-api/backups:/app/backups
      - playwright-profile:/app/playwright-registry-worker
    env_file:
      - ./vet-api/.env
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  landing:
    build: ./landing
    container_name: vetty-landing
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data

volumes:
  playwright-profile:
  uptime-kuma-data:
  portainer-data:
